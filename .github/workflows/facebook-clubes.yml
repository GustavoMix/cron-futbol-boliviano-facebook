name: FB 2 - Clubes

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */2 * * *"

concurrency:
  group: fb-clubes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-facebook.txt
      - name: Dependencias Facebook (ligeras)
        run: python -m pip install --disable-pip-version-check -r requirements-facebook.txt
      - name: Usar Chrome ya instalado en GitHub
        shell: bash
        run: |
          command -v google-chrome
          google-chrome --version

      - name: Recolectar Facebook - clubes
        run: python -u facebook_worker.py --group clubes
      - name: Unir JSON de la app
        run: python merge_partials.py
      - name: Guardar resultados
        shell: bash
        run: |
          git config user.name "football-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add partials/facebook_clubes.json facebook_latest.json social.json latest.json app_feed.json manifest.json current_tables.json bolivia.json conmebol.json internacional.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "data: facebook clubes"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
