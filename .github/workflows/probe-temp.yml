name: Probe temporal de fuentes
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar tabla en diez.bo
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          for path in "tabla-de-posiciones" "posiciones" "futbol/tabla-de-posiciones" "division-profesional" "futbol"; do
            code=$(curl -sL -o out.html -w "%{http_code}" -A "$UA" --max-time 15 "https://diez.bo/$path")
            size=$(wc -c < out.html)
            hits=$(grep -oic "always ready" out.html || true)
            echo "$code size=$size hits=$hits  https://diez.bo/$path"
          done
          echo "--- links en homepage con 'posicion' o 'tabla' ---"
          curl -sL -A "$UA" --max-time 15 "https://diez.bo/" -o home.html
          grep -oiE 'href="[^"]*(posicion|tabla)[^"]*"' home.html | sort -u | head -10
