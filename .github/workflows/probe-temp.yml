name: Probe temporal de fuentes
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar URLs candidatas
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          urls=(
            "https://www.futbol24.com/Standings/Bolivia/Division-Profesional/"
            "https://www.mismarcadores.com/futbol/bolivia/division-profesional/"
            "https://www.diez.bo"
            "https://www.golstadium.com/tabla-de-posiciones/bolivia"
            "https://www.futbolred.com/bolivia/division-profesional-de-bolivia/tabla-de-posiciones"
            "https://www.tycsports.com/futbol-internacional/bolivia"
            "https://www.365scores.com/es-mx/football/league/bolivia-primera-division-46"
            "https://www.sofascore.com/es/torneo/futbol/bolivia/division-profesional/236"
          )
          for u in "${urls[@]}"; do
            code=$(curl -sL -o /tmp/out.html -w "%{http_code}" -A "$UA" --max-time 20 "$u" || echo "ERR")
            final=$(curl -sL -o /dev/null -w "%{url_effective}" -A "$UA" --max-time 20 "$u" || echo "ERR")
            size=$(wc -c < /tmp/out.html 2>/dev/null || echo 0)
            hits=$(grep -oic "always ready\|division profesional\|bol.var" /tmp/out.html 2>/dev/null || echo 0)
            echo "$code size=$size hits=$hits final=$final  orig=$u"
          done
