name: WEB 4 - Noticias y datos

on:
  workflow_dispatch:
  schedule:
    - cron: "57 * * * *"

concurrency:
  group: web-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - name: Dependencias WEB (sin Playwright)
        run: python -m pip install --disable-pip-version-check -r requirements-web.txt
      - name: Recolectar webs / tablas
        run: python -u web_worker.py
      - name: Unir JSON de la app
        run: python merge_partials.py
      - name: Guardar resultados
        shell: bash
        run: |
          git config user.name "football-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add partials/web facebook_latest.json social.json latest.json app_feed.json current_tables.json bolivia.json conmebol.json internacional.json manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: web noticias y tablas"

          # Otros workflows (facebook-*) regeneran y commitean estos mismos
          # JSON en paralelo. No es una carrera de timing: cada corrida
          # reescribe el archivo COMPLETO con contenido distinto, así que un
          # rebase choca con el mismo conflicto sin importar cuántas veces
          # se reintente (ya lo probamos: 5 reintentos, mismo choque las 5).
          # En vez de perder toda la corrida, se resuelve el conflicto a
          # favor de nuestra versión (-X ours): el archivo compartido que
          # "pierda" por un rato se corrige solo en la próxima corrida de
          # cualquiera de los dos workflows (corren cada 1-2 h).
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if git merge --no-edit -X ours "origin/$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Intento $attempt de subir falló; reintentando..."
            git merge --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::No se pudo subir los datos después de varios intentos."
          exit 1
