name: WEB 4 - Noticias y datos

on:
  workflow_dispatch:
  schedule:
    - cron: "57 * * * *"

concurrency:
  group: web-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - name: Dependencias WEB (sin Playwright)
        run: python -m pip install --disable-pip-version-check -r requirements-web.txt
      - name: Recolectar webs / tablas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u web_worker.py
      - name: Unir JSON de la app
        run: python merge_partials.py
      - name: Guardar resultados
        shell: bash
        run: |
          git config user.name "football-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add partials/web facebook_latest.json social.json latest.json app_feed.json current_tables.json bolivia.json conmebol.json internacional.json manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: web noticias y tablas"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
